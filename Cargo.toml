[workspace]
members = ["backend", "generator"]
resolver = "2"

[workspace.dependencies]
tokio = "1.44"
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
config = "0.14"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
aws-sdk-s3 = "1.66"
aws-config = "1.5"
bcrypt = "0.15"
base64 = "0.22"
rand = "0.8"
bytes = "1.8"
lofty = "0.21"
walkdir = "2.5"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
socket2 = "0.5"
