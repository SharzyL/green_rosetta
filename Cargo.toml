[workspace]
members = ["generator"]
resolver = "2"

[workspace.dependencies]
tokio = "1.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
walkdir = "2.5"
