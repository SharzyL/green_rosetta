[workspace]
members = ["backend", "generator"]
resolver = "2"

[workspace.dependencies]
tokio = "1.44"
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
bcrypt = "0.15"
base64 = "0.22"
rand = "0.8"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
socket2 = "0.5"
